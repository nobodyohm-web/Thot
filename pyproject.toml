[project]
name = "thot"
version = "0.1.0"
description = "Proof-backed code audit engine"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7",
    "pyyaml>=6.0",
    "httpx>=0.28.1",
    "prompt-toolkit>=3.0.53",
]

[project.scripts]
thot = "thot.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"skills" = "thot/skills/library"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/thot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = ["pytest>=8.0"]
