[project]
name = "thot"
version = "0.1.0"
description = "Proof-backed code audit engine"
# Upper bound inherited from Hermes: it caps at <3.14 because its
# Rust-backed transitives have no cp314 wheel. A workspace resolves one
# interpreter for every member, so the cap has to be stated here too.
requires-python = ">=3.11,<3.14"
dependencies = [
    # Floors, never ceilings. Hermes exact-pins these same packages on
    # purpose (supply-chain blast radius), and a Thot ceiling would make the
    # workspace unresolvable. `prompt-toolkit>=3.0.53` against Hermes's
    # `==3.0.52` was exactly that: the first conflict of the fusion.
    "rich>=13.7",
    "pyyaml>=6.0",
    "httpx>=0.28.1",
    "prompt-toolkit>=3.0.52",
    # The other half of the program. A workspace member, so a checkout of
    # Thot is a checkout of Hermes — not a copy of it that drifts.
    #
    # `[mcp]` is not optional here, whatever it is called upstream. It is the
    # extra that installs the MCP SDK, and without it `tools/mcp_tool` fails
    # `_ensure_mcp_sdk()` and returns no tools at all — silently, at debug
    # level. `thot fusion wire` would go on writing plugin.json and mcp.json,
    # `thot fusion status` would go on printing "branché : 4/4", and the
    # agent would have no `code_map`, no `find_symbol`, no `callers`: not
    # Thot's ones, not any. Half of what the fusion means is this extra.
    "hermes-agent[mcp]",
]

[project.scripts]
thot = "thot.cli:run"

[tool.uv.workspace]
members = ["hermes"]

[tool.uv.sources]
hermes-agent = { workspace = true }

[tool.uv]
# Lifted verbatim from hermes/pyproject.toml. In a workspace only the root's
# `[tool.uv]` is read, so leaving these behind would silently undo Hermes's
# supply-chain posture — the pynacl and cryptography overrides exist because
# the published dependency ranges hold known-vulnerable versions.
override-dependencies = [
  "pynacl>=1.6,<1.7",
  "cryptography>=50,<51",
]
exclude-newer = "14 days"
# Une date, pas un booléen : uv 0.9 refuse `false`, échoue à parser tout
# `[tool.uv]`, et n'émet qu'un warning — `exclude-newer` n'était donc PAS
# appliqué, silencieusement, alors que le commentaire ci-dessus promet
# l'inverse. Une date lointaine exempte, ce que `false` voulait dire.
exclude-newer-package = { vercel = "2100-01-01T00:00:00Z", nemo-relay = "2100-01-01T00:00:00Z", huggingface_hub = "2100-01-01T00:00:00Z", h2 = "2100-01-01T00:00:00Z", aiohttp = "2100-01-01T00:00:00Z", cryptography = "2100-01-01T00:00:00Z", defusedxml = "2100-01-01T00:00:00Z", python-olm = "2100-01-01T00:00:00Z", unpaddedbase64 = "2100-01-01T00:00:00Z", setuptools = "2100-01-01T00:00:00Z", pillow = "2100-01-01T00:00:00Z", mcp = "2100-01-01T00:00:00Z" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
# Each destination is the second candidate its loader looks for, so an
# editable checkout and an installed wheel resolve the same content.
"skills" = "thot/skills/library"
"optional-skills" = "thot/skills/optional-skills"
"plugins" = "thot/plugins/library"
"commands" = "thot/commands/library"
"mcp-catalog" = "thot/mcp/mcp-catalog"
# The Prime integration: a skill package Prime loads into its own kernel.
# Prime reaches an MCP server through an `rlm.McpIntegration` subclass and
# there is no generic path that connects a declared server without one, so a
# Thot that shipped only the settings entry would wire Prime to nothing.
"prime-skill" = "thot/prime-skill"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/thot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = ["pytest>=8.0"]
